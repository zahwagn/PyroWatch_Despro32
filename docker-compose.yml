version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pyrowatch-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - pyrowatch-net

  node-red:
    image: nodered/node-red:latest
    container_name: pyrowatch-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/data:/data
      - ./ml:/ml
    environment:
      - TZ=Asia/Jakarta
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mosquitto
    networks:
      - pyrowatch-net
  ml:
    build:
      context: ./ml
    container_name: pyrowatch-ml
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - pyrowatch-net


networks:

  pyrowatch-net:
    driver: bridge